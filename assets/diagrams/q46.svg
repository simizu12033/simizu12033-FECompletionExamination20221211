<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title46"><title id="title46">問46 カプセル化</title><defs><marker id="a46" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問46 カプセル化</text><rect x="280" y="95" width="465" height="345" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="510" y="140" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">銀行口座オブジェクト（例）</text><rect x="330" y="190" width="360" height="82" rx="8" fill="#fff0c7" stroke="#2563a6" stroke-width="2"/><text x="510" y="240" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">公開する操作：入金・出金</text><rect x="330" y="315" width="360" height="80" rx="8" fill="white" stroke="#087f68" stroke-width="2"/><text x="510" y="365" font-size="25" fill="#087f68" text-anchor="middle" font-weight="400">内部の属性：残高</text><rect x="35" y="200" width="180" height="75" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><text x="47" y="230" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">外部の処理</text><path d="M215 237 L330 230" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a46)"/><path d="M215 330 L305 355" fill="none" stroke="#b33b44" stroke-width="3"/><text x="195" y="400" font-size="21" fill="#b33b44" text-anchor="middle" font-weight="400">直接変更させない</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">データと操作をまとめ、利用者には必要な窓口だけを公開する</text></g></svg>