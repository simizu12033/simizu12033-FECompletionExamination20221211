<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title71"><title id="title71">問71 セル生産方式</title><defs><marker id="a71" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問71 セル生産方式</text><text x="210" y="105" font-size="22" fill="#16324f" text-anchor="middle" font-weight="700">セル生産：1人・少人数で多工程</text><rect x="70" y="150" width="130" height="70" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="82" y="180" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">組立</text><rect x="250" y="150" width="130" height="70" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="262" y="180" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">検査</text><rect x="250" y="310" width="130" height="70" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="262" y="340" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">梱包</text><rect x="70" y="310" width="130" height="70" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="82" y="340" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">調整</text><path d="M200 185 L250 185" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a71)"/><path d="M315 220 L315 310" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a71)"/><path d="M250 345 L200 345" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a71)"/><circle cx="230" cy="270" r="24" fill="#fff0c7" stroke="#2563a6" stroke-width="3"/><text x="230" y="280" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">人</text><rect x="465" y="145" width="280" height="245" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><text x="605" y="195" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">ライン生産</text><text x="490" y="245" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">工程ごとに分担</text><text x="490" y="277" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">同じ製品を順に流す</text><text x="490" y="309" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">大量生産に適する</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">セル生産は作業変更に対応しやすく、多品種少量の生産向き</text></g></svg>