<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title65"><title id="v7title65">問65 評価項目の重み付き平均</title><desc>重み×評価点を足し、目標点で割る。実績27点 ÷ 目標75点 ×100 = 36％</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問65 評価項目の重み付き平均</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">重み×評価点を足し、目標点で割る</text><path d="M30 108H770" stroke="#cbdde9"/><text x="45" y="205" font-size="23" fill="#16324f" text-anchor="start" font-weight="700">省力化</text><text x="45" y="245" font-size="21" fill="#61768a" text-anchor="start" font-weight="400">重み 5</text><circle cx="295" cy="190" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><circle cx="370" cy="190" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><circle cx="445" cy="190" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="555" y="199" font-size="27" fill="#078268" text-anchor="middle" font-weight="700">5 × 3 = 15</text><text x="45" y="340" font-size="23" fill="#16324f" text-anchor="start" font-weight="700">期間短縮</text><text x="45" y="380" font-size="21" fill="#61768a" text-anchor="start" font-weight="400">重み 8</text><circle cx="295" cy="325" r="23" fill="white" stroke="#a9c0d1" stroke-width="2.5"/><circle cx="370" cy="325" r="23" fill="white" stroke="#a9c0d1" stroke-width="2.5"/><circle cx="445" cy="325" r="23" fill="white" stroke="#a9c0d1" stroke-width="2.5"/><text x="555" y="334" font-size="27" fill="#078268" text-anchor="middle" font-weight="700">8 × 0 = 0</text><text x="45" y="475" font-size="23" fill="#16324f" text-anchor="start" font-weight="700">情報統合</text><text x="45" y="515" font-size="21" fill="#61768a" text-anchor="start" font-weight="400">重み 12</text><circle cx="295" cy="460" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><circle cx="370" cy="460" r="23" fill="white" stroke="#a9c0d1" stroke-width="2.5"/><circle cx="445" cy="460" r="23" fill="white" stroke="#a9c0d1" stroke-width="2.5"/><text x="555" y="469" font-size="27" fill="#078268" text-anchor="middle" font-weight="700">12 × 1 = 12</text><text x="400" y="592" font-size="21" fill="#61768a" text-anchor="middle" font-weight="400">各項目の満点は3点：5×3 + 8×3 + 12×3 = 75</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">実績27点 ÷ 目標75点 ×100 = 36％</text></g></svg>