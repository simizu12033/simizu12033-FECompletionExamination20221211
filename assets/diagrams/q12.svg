<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title12"><title id="v7title12">問12 CPUの処理時間</title><desc>同じ命令数なら、CPI×周期を比較する。A/B = (4×1)/(0.5×4) = 2倍</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問12 CPUの処理時間</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">同じ命令数なら、CPI×周期を比較する</text><path d="M30 108H770" stroke="#cbdde9"/><text x="60" y="250" font-size="30" fill="#16324f" text-anchor="start" font-weight="700">A</text><rect x="130" y="210" width="520" height="64" rx="4" fill="#e4f5ed" stroke="#078268" stroke-width="2"/><text x="150" y="188" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">4 CPI × 1 ns</text><text x="650" y="315" font-size="25" fill="#078268" text-anchor="end" font-weight="700">4 ns</text><text x="60" y="420" font-size="30" fill="#16324f" text-anchor="start" font-weight="700">B</text><rect x="130" y="380" width="260" height="64" rx="4" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="150" y="358" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">0.5 CPI × 4 ns</text><text x="390" y="485" font-size="25" fill="#078268" text-anchor="end" font-weight="700">2 ns</text><text x="400" y="570" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">周期だけでなく、命令に使うクロック数も見る</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">A/B = (4×1)/(0.5×4) = 2倍</text></g></svg>