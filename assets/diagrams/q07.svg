<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title7"><title id="v7title7">問7 木と隣接行列</title><desc>木は「全てつながる」「閉路がない」。5頂点・4辺、連結で閉路なし → 木</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問7 木と隣接行列</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">木は「全てつながる」「閉路がない」</text><path d="M30 108H770" stroke="#cbdde9"/><path d="M150 220L365 335" stroke="#078268" stroke-width="5" fill="none"/><path d="M150 220L630 205" stroke="#078268" stroke-width="5" fill="none"/><path d="M365 335L230 510" stroke="#078268" stroke-width="5" fill="none"/><path d="M365 335L505 510" stroke="#078268" stroke-width="5" fill="none"/><circle cx="150" cy="220" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="150" y="227" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">1</text><circle cx="365" cy="335" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="365" y="342" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">2</text><circle cx="230" cy="510" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="230" y="517" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">3</text><circle cx="505" cy="510" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="505" y="517" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">4</text><circle cx="630" cy="205" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="630" y="212" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">5</text><text x="385" y="170" font-size="22" fill="#61768a" text-anchor="middle" font-weight="400">1—2、1—5、2—3、2—4</text><text x="650" y="390" font-size="27" fill="#2872ae" text-anchor="middle" font-weight="700">頂点 5</text><text x="650" y="440" font-size="27" fill="#078268" text-anchor="middle" font-weight="700">辺 4</text><text x="650" y="498" font-size="23" fill="#61768a" text-anchor="middle" font-weight="400">n−1本</text><text x="300" y="585" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">枝をたどっても、同じ頂点へ一周して戻れない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">5頂点・4辺、連結で閉路なし → 木</text></g></svg>