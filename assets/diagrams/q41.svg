<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title41"><title id="v7title41">問41 SQLインジェクション対策</title><desc>SQLの命令と、入力した値を混ぜない。プレースホルダへ値をバインドし、構造とデータを分離</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問41 SQLインジェクション対策</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">SQLの命令と、入力した値を混ぜない</text><path d="M30 108H770" stroke="#cbdde9"/><text x="45" y="160" font-size="25" fill="#b34b52" text-anchor="start" font-weight="700">危険：文字列へ直接連結</text><rect x="45" y="190" width="710" height="70" rx="8" fill="#fff0ed" stroke="#b34b52" stroke-width="2"/><text x="65" y="236" font-size="28" fill="#b34b52" text-anchor="start" font-weight="400">入力：&#x27; OR &#x27;1&#x27;=&#x27;1</text><path d="M400 270L400 320" stroke="#b34b52" stroke-width="3" fill="none"/><path d="M400.0 320.0L394.3 308.3L405.7 308.3Z" stroke="#b34b52" stroke-width="1" fill="#b34b52"/><text x="400" y="355" font-size="24" fill="#b34b52" text-anchor="middle" font-weight="400">入力がSQL命令として働いてしまう</text><text x="45" y="420" font-size="25" fill="#078268" text-anchor="start" font-weight="700">対策：2つを別々に渡す</text><g transform="translate(110 515) scale(0.6)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="250" y="481" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">SQL：WHERE user_id = ?</text><text x="250" y="544" font-size="22" fill="#078268" text-anchor="start" font-weight="400">値：入力した文字列</text><path d="M610 505L700 505" stroke="#078268" stroke-width="3" fill="none"/><path d="M700.0 505.0L688.3 510.7L688.3 499.3Z" stroke="#078268" stroke-width="1" fill="#078268"/><g transform="translate(730 505) scale(0.45)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-43 -27V31C-43 51 43 51 43 31V-27" fill="white"/><ellipse cx="0" cy="-27" rx="43" ry="15" fill="#e4f5ed"/><path d="M-43 -1C-43 18 43 18 43 -1M-43 17C-43 36 43 36 43 17" fill="none"/></g><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">プレースホルダへ値をバインドし、構造とデータを分離</text></g></svg>