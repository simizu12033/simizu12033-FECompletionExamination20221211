<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title21"><title id="title21">問21 チャタリング</title><defs><marker id="a21" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問21 チャタリング</text><path d="M80 395 L730 395" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a21)"/><path d="M80 395 L80 165" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a21)"/><text x="730" y="433" font-size="20" fill="#16324f" text-anchor="end" font-weight="400">時間</text><text x="72" y="147" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">接点の状態</text><text x="33" y="205" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">ON</text><text x="33" y="389" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">OFF</text><path d="M80 390 H200 V200 H218 V390 H233 V200 H252 V390 H273 V200 H295 V390 H315 V200 H730" fill="none" stroke="#087f68" stroke-width="4"/><rect x="195" y="155" width="126" height="270" rx="8" fill="none" stroke="#b33b44" stroke-width="2"/><text x="260" y="127" font-size="22" fill="#b33b44" text-anchor="middle" font-weight="400">短時間の振動</text><text x="515" y="290" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">最終的にはONで安定</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">1回押したつもりでも、電気信号は何度もON/OFFする</text></g></svg>