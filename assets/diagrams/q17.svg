<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" role="img" aria-labelledby="v7title17"><title id="v7title17">問17 タスク間の競合</title><desc>読んだ値は、共有xが変わっても変わらない。e=3を保存した後にBが更新 → f=9となり、最終x=12</desc><rect width="800" height="840" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問17 タスク間の競合</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">読んだ値は、共有xが変わっても変わらない</text><path d="M30 108H770" stroke="#cbdde9"/><text x="150" y="150" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">タスクA</text><path d="M150 175V690" stroke="#b1c8da" stroke-width="2" fill="none" stroke-dasharray="8 6"/><text x="400" y="150" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">共有x</text><path d="M400 175V690" stroke="#b1c8da" stroke-width="2" fill="none" stroke-dasharray="8 6"/><text x="650" y="150" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">タスクB</text><path d="M650 175V690" stroke="#b1c8da" stroke-width="2" fill="none" stroke-dasharray="8 6"/><circle cx="400" cy="200" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="400" y="207" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">3</text><path d="M375 245L180 245" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M180.0 245.0L191.7 239.3L191.7 250.7Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><rect x="229.0" y="211.0" width="97" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="277.5" y="233.0" font-size="19" fill="#2872ae" text-anchor="middle" font-weight="400">a1: e←3</text><text x="150" y="290" font-size="20" fill="#078268" text-anchor="middle" font-weight="400">eは3を保持</text><path d="M425 330L620 330" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M620.0 330.0L608.3 335.7L608.3 324.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><rect x="450.5" y="296.0" width="144" height="29" rx="4" fill="