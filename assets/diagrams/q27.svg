<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title27"><title id="title27">問27 NOT EXISTS</title><defs><marker id="a27" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問27 NOT EXISTS</text><rect x="55" y="100" width="690" height="325" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><text x="80" y="140" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">商品マスタの全商品</text><circle cx="455" cy="280" r="115" fill="#edf4fb" stroke="#2563a6" stroke-width="3"/><text x="455" y="265" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">在庫がある</text><text x="455" y="303" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">商品番号</text><circle cx="160" cy="235" r="40" fill="#dcf3e9" stroke="#087f68" stroke-width="3"/><text x="160" y="242" font-size="19" fill="#087f68" text-anchor="middle" font-weight="400">商品A</text><circle cx="235" cy="345" r="40" fill="#dcf3e9" stroke="#087f68" stroke-width="3"/><text x="235" y="352" font-size="19" fill="#087f68" text-anchor="middle" font-weight="400">商品D</text><text x="145" y="395" font-size="22" fill="#087f68" text-anchor="start" font-weight="400">選ぶのは円の外</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">NOT EXISTS：その商品と同じ商品番号が在庫表に「ない」</text></g></svg>