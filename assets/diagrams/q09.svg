<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title9"><title id="v7title9">問9 線形探索の流れ図</title><desc>先頭から調べ、最初の一致で止まる。一致ならその位置。見つからなければ k = N+1</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問9 線形探索の流れ図</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">先頭から調べ、最初の一致で止まる</text><path d="M30 108H770" stroke="#cbdde9"/><text x="55" y="158" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">例：Xを探す</text><rect x="75" y="205" width="144" height="50" rx="5" fill="#fff0ce" stroke="#078268" stroke-width="2"/><text x="147.0" y="239" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">X</text><rect x="225" y="205" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="297.0" y="239" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">A</text><rect x="375" y="205" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="447.0" y="239" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">B</text><rect x="525" y="205" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="597.0" y="239" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">X</text><g transform="translate(150 326) scale(0.65)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="-7" cy="-9" r="30" fill="white"/><path d="M15 16L45 46" stroke-width="8"/></g><text x="150" y="401" font-size="23" fill="#078268" text-anchor="middle" font-weight="700">k=1で終了</text><path d="M225 312H645" stroke="#61768a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><text x="480" y="350" font-size="22" fill="#61768a" text-anchor="middle" font-weight="400">後ろのXは調べない</text><text x="55" y="465" font-size="23" fill="#16324f" text-anchor="start" font-weight="700">不一致が続く場合</text><rect x="75" y="500" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="147.0" y="534" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">A</text><rect x="225" y="500" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="297.0" y="534" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">B</text><rect x="375" y="500" width="144" height="50" rx="5" fill="#e8f1fa" stroke="#c2d4e3" stroke-width="2"/><text x="447.0" y="534" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">C</text><rect x="525" y="500" width="144" height="50" rx="5" fill="#fff0ce" stroke="#078268" stroke-width="2"/><text x="597.0" y="534" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">範囲外</text><text x="675" y="594" font-size="23" fill="#b34b52" text-anchor="middle" font-weight="700">N+1</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">一致ならその位置。見つからなければ k = N+1</text></g></svg>