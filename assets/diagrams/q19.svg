<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title19"><title id="v7title19">問19 コンパイラの最適化</title><desc>同じ計算は一度だけ。結果は変えない。共通部分式を再利用する → コンパイラ最適化</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問19 コンパイラの最適化</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">同じ計算は一度だけ。結果は変えない</text><path d="M30 108H770" stroke="#cbdde9"/><text x="205" y="160" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">最適化前</text><text x="600" y="160" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">最適化後</text><circle cx="100" cy="280" r="48" fill="#e8f1fa" stroke="#2872ae" stroke-width="2.5"/><text x="100" y="288" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">a×b</text><circle cx="300" cy="280" r="48" fill="#e8f1fa" stroke="#2872ae" stroke-width="2.5"/><text x="300" y="288" font-size="26" fill="#16324f" text-anchor="middle" font-weight="400">a×b</text><path d="M100 330L180 420" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M180.0 420.0L168.0 415.0L176.4 407.5Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M300 330L220 420" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M220.0 420.0L223.6 407.5L232.0 415.0Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><circle cx="200" cy="465" r="38" fill="#fff0ce" stroke="#ac661b" stroke-width="2.5"/><text x="200" y="477" font-size="35" fill="#ac661b" text-anchor="middle" font-weight="400">＋</text><text x="200" y="560" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">乗算2回</text><circle cx="600" cy="260" r="48" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="600" y="268" font-size="26" fill="#078268" text-anchor="middle" font-weight="400">a×b</text><text x="600" y="340" font-size="21" fill="#078268" text-anchor="middle" font-weight="400">tへ保存</text><path d="M575 320L550 425" stroke="#078268" stroke-width="3" fill="none"/><path d="M550.0 425.0L547.2 412.3L558.2 414.9Z" stroke="#078268" stroke-width="1" fill="#078268"/><path d="M625 320L650 425" stroke="#078268" stroke-width="3" fill="none"/><path d="M650.0 425.0L641.8 414.9L652.8 412.3Z" stroke="#078268" stroke-width="1" fill="#078268"/><text x="600" y="478" font-size="32" fill="#078268" text-anchor="middle" font-weight="700">t + t</text><text x="600" y="560" font-size="24" fill="#078268" text-anchor="middle" font-weight="400">乗算1回</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">共通部分式を再利用する → コンパイラ最適化</text></g></svg>