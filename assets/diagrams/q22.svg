<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title22"><title id="v7title22">問22 電力量</title><desc>電力量は、運転している面積の合計。1000W × (60+30)/60時間 = 1500Wh</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問22 電力量</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">電力量は、運転している面積の合計</text><path d="M30 108H770" stroke="#cbdde9"/><text x="400" y="157" font-size="27" fill="#16324f" text-anchor="middle" font-weight="700">100V × 10A = 1000W</text><path d="M100 510L700 510" stroke="#16324f" stroke-width="3" fill="none"/><path d="M700.0 510.0L688.3 515.7L688.3 504.3Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><path d="M100 510L100 240" stroke="#16324f" stroke-width="3" fill="none"/><path d="M100.0 240.0L105.7 251.7L94.3 251.7Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><text x="700" y="546" font-size="19" fill="#16324f" text-anchor="end" font-weight="400"></text><text x="100" y="220" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">電力 W</text><text x="700" y="584" font-size="19" fill="#61768a" text-anchor="end" font-weight="400">時間（分）</text><rect x="100" y="280" width="300" height="230" rx="0" fill="#e4f5ed" stroke="#078268" stroke-width="2"/><rect x="550" y="280" width="150" height="230" rx="0" fill="#e4f5ed" stroke="#078268" stroke-width="2"/><text x="100" y="548" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">0</text><text x="400" y="548" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">60</text><text x="550" y="548" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">90</text><text x="700" y="548" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">120</text><text x="250" y="405" font-size="24" fill="#078268" text-anchor="middle" font-weight="400">運転60分</text><text x="625" y="405" font-size="23" fill="#078268" text-anchor="middle" font-weight="400">30分</text><text x="475" y="475" font-size="22" fill="#b34b52" text-anchor="middle" font-weight="400">停止</text><text x="83" y="287" font-size="19" fill="#61768a" text-anchor="end" font-weight="400">1000</text><text x="400" y="603" font-size="23" fill="#b34b52" text-anchor="middle" font-weight="400">停止中の30分は面積に含めない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">1000W × (60+30)/60時間 = 1500Wh</text></g></svg>