<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title32"><title id="title32">問32 pingとICMP</title><defs><marker id="a32" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問32 pingとICMP</text><rect x="55" y="140" width="210" height="130" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="67" y="170" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">送信元</text><text x="67" y="200" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">pingを実行</text><rect x="535" y="140" width="210" height="130" rx="8" fill="#fff0c7" stroke="#2563a6" stroke-width="2"/><text x="547" y="170" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">到達先</text><text x="547" y="200" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">IPアドレス</text><path d="M265 180 L535 180" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a32)"/><text x="400" y="145" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">ICMP Echo Request</text><path d="M535 240 L265 240" fill="none" stroke="#087f68" stroke-width="3" marker-end="url(#a32)"/><text x="400" y="300" font-size="22" fill="#087f68" text-anchor="middle" font-weight="400">ICMP Echo Reply</text><text x="90" y="390" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">往復時間や応答の有無を確認する。応答がなくても、通信経路でI</text><text x="90" y="421" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">CMPが遮断されている場合がある。</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">pingの基盤はICMP。SMTPやSNMPではない</text></g></svg>