<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title42"><title id="v7title42">問42 VPNとOSI参照モデル</title><desc>どの階層でトンネルや保護を作るか。上から TLS → IPsec → L2TP の相対関係</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問42 VPNとOSI参照モデル</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">どの階層でトンネルや保護を作るか</text><path d="M30 108H770" stroke="#cbdde9"/><path d="M80 560L80 180" stroke="#16324f" stroke-width="3" fill="none"/><path d="M80.0 180.0L85.7 191.7L74.3 191.7Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><text x="80" y="150" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">上位</text><text x="80" y="603" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">下位</text><path d="M145 185L635 185L600 270H110Z" stroke="#2872ae" stroke-width="2" fill="#fff0ce"/><text x="185" y="218" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">TLS</text><text x="185" y="251" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">上位の通信を保護</text><path d="M145 330L705 330L670 415H110Z" stroke="#2872ae" stroke-width="2" fill="#e4f5ed"/><text x="185" y="363" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">IPsec</text><text x="185" y="396" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">IPの層で保護</text><path d="M145 475L775 475L740 560H110Z" stroke="#2872ae" stroke-width="2" fill="#e8f1fa"/><text x="185" y="508" font-size="29" fill="#16324f" text-anchor="start" font-weight="700">L2TP</text><text x="185" y="541" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">L2のトンネル</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">上から TLS → IPsec → L2TP の相対関係</text></g></svg>