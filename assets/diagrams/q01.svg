<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title1"><title id="v7title1">問1 桁落ち</title><desc>近い数を引くと、共通する桁が消える。残った桁の精度が低い → 桁落ち</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問1 桁落ち</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">近い数を引くと、共通する桁が消える</text><path d="M30 108H770" stroke="#cbdde9"/><text x="70" y="165" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">引く前：有効な桁が多い</text><text x="130" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">1</text><path d="M112 191L148 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="191" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">.</text><path d="M173 191L209 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="252" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">2</text><path d="M234 191L270 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="313" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">3</text><path d="M295 191L331 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="374" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">4</text><path d="M356 191L392 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="435" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">5</text><path d="M417 191L453 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="496" y="225" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">6</text><path d="M478 191L514 230" stroke="#b34b52" stroke-width="3" fill="none"/><text x="557" y="225" font-size="43" fill="#078268" text-anchor="middle" font-weight="700">7</text><text x="130" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">1</text><path d="M112 266L148 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="191" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">.</text><path d="M173 266L209 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="252" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">2</text><path d="M234 266L270 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="313" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">3</text><path d="M295 266L331 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="374" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">4</text><path d="M356 266L392 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="435" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">5</text><path d="M417 266L453 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="496" y="300" font-size="43" fill="#61768a" text-anchor="middle" font-weight="700">6</text><path d="M478 266L514 305" stroke="#b34b52" stroke-width="3" fill="none"/><text x="557" y="300" font-size="43" fill="#078268" text-anchor="middle" font-weight="700">1</text><text x="65" y="300" font-size="44" fill="#16324f" text-anchor="start" font-weight="400">−</text><path d="M85 324H660" stroke="#16324f" stroke-width="2" fill="none"/><text x="365" y="400" font-size="45" fill="#078268" text-anchor="middle" font-weight="700">0.000006</text><path d="M610 342L610 445" stroke="#078268" stroke-width="3" fill="none"/><path d="M610.0 445.0L604.3 433.3L615.7 433.3Z" stroke="#078268" stroke-width="1" fill="#078268"/><text x="400" y="496" font-size="24" fill="#16324f" text-anchor="middle" font-weight="400">上位桁が相殺され、下位の誤差が目立つ</text><text x="400" y="555" font-size="22" fill="#61768a" text-anchor="middle" font-weight="400">丸め誤差や情報落ちとは、起き方が違う</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">残った桁の精度が低い → 桁落ち</text></g></svg>