55" y="316" width="180" height="61" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="145.0" y="353.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">1とNにXがある</text><rect x="235" y="316" width="265" height="61" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="367.5" y="353.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">A(1)=Xで終了</text><rect x="500" y="316" width="265" height="61" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="632.5" y="353.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">1</text><rect x="55" y="377" width="180" height="61" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="145.0" y="414.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">どこにもXがない</text><rect x="235" y="377" width="265" height="61" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="367.5" y="414.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">A(N)まで不一致</text><rect x="500" y="377" width="265" height="61" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="632.5" y="414.5" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">N+1</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">後ろにも同じ値があっても、最初に見つけた位置を返す</text></g></svg>