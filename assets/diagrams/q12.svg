<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title12"><title id="title12">問12 CPUの処理時間</title><defs><marker id="a12" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問12 CPUの処理時間</text><text x="80" y="105" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">同じ命令数 → 1命令当たりで比較できる</text><text x="70" y="222" font-size="30" fill="#16324f" text-anchor="start" font-weight="700">A</text><rect x="135" y="180" width="480" height="62" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="155" y="222" font-size="25" fill="#16324f" text-anchor="start" font-weight="400">4.0 × 1ns = 4ns</text><text x="70" y="337" font-size="30" fill="#16324f" text-anchor="start" font-weight="700">B</text><rect x="135" y="295" width="240" height="62" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="155" y="337" font-size="25" fill="#16324f" text-anchor="start" font-weight="400">0.5 × 4ns = 2ns</text><text x="400" y="435" font-size="28" fill="#087f68" text-anchor="middle" font-weight="700">Aの時間 / Bの時間 = 4 / 2 = 2</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">クロック周期だけでなく、1命令に使うクロック数も掛ける</text></g></svg>