<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title25"><title id="title25">問25 SQLのGRANT</title><defs><marker id="a25" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問25 SQLのGRANT</text><rect x="35" y="170" width="165" height="100" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="47" y="200" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">管理者</text><rect x="580" y="170" width="165" height="100" rx="8" fill="#fff0c7" stroke="#2563a6" stroke-width="2"/><text x="592" y="200" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">利用者</text><path d="M200 205 L580 205" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a25)"/><text x="390" y="180" font-size="23" fill="#16324f" text-anchor="middle" font-weight="700">GRANT SELECT ON 表</text><path d="M580 320 L200 320" fill="none" stroke="#b33b44" stroke-width="3" marker-end="url(#a25)"/><text x="390" y="365" font-size="22" fill="#b33b44" text-anchor="middle" font-weight="400">REVOKE：与えた権限を取り消す</text><rect x="260" y="400" width="280" height="48" rx="8" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="400" y="432" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">表や行を削除する文ではない</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">GRANTは「誰に、何をしてよいか」を設定するSQL</text></g></svg>