<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title19"><title id="title19">問19 コンパイラの最適化</title><defs><marker id="a19" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問19 コンパイラの最適化</text><rect x="35" y="120" width="340" height="230" rx="8" fill="white" stroke="#b7c9dc" stroke-width="2"/><rect x="425" y="120" width="340" height="230" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="60" y="160" font-size="25" fill="#16324f" text-anchor="start" font-weight="700">最適化前</text><text x="450" y="160" font-size="25" fill="#087f68" text-anchor="start" font-weight="700">最適化後</text><text x="60" y="220" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">y = a × b + a × b</text><text x="450" y="220" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">t = a × b</text><text x="450" y="265" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">y = t + t</text><text x="60" y="310" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">乗算を2回</text><text x="450" y="310" font-size="23" fill="#087f68" text-anchor="start" font-weight="400">共通する乗算を1回に</text><text x="60" y="400" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">例：aとbが変わらず、副作用がないときの共通部分式の除去。結</text><text x="60" y="431" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">果を保ったまま計算を減らす。</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">速くするためでも、プログラムの意味を変えてはいけない</text></g></svg>