<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title47"><title id="v7title47">問47 平均比較回数</title><desc>頻度の高い項目を先に調べると平均が下がる。高頻度順1.5回、低頻度順2.5回（説明用の例）</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問47 平均比較回数</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">頻度の高い項目を先に調べると平均が下がる</text><path d="M30 108H770" stroke="#cbdde9"/><text x="400" y="155" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">例：A 60％、B 30％、C 10％</text><text x="45" y="250" font-size="23" fill="#078268" text-anchor="start" font-weight="700">A → B → C</text><rect x="275" y="220" width="90.0" height="65" rx="0" fill="#e4f5ed" stroke="#078268" stroke-width="2"/><text x="320.0" y="317" font-size="20" fill="#078268" text-anchor="middle" font-weight="400">A</text><rect x="365.0" y="220" width="90.0" height="65" rx="0" fill="#fff0ce" stroke="#078268" stroke-width="2"/><text x="410.0" y="317" font-size="20" fill="#078268" text-anchor="middle" font-weight="400">B</text><rect x="455.0" y="220" width="45.0" height="65" rx="0" fill="#e8f1fa" stroke="#078268" stroke-width="2"/><text x="477.5" y="317" font-size="20" fill="#078268" text-anchor="middle" font-weight="400">C</text><text x="275" y="358" font-size="21" fill="#61768a" text-anchor="start" font-weight="400">Σ（出現確率 × 比較回数）</text><text x="45" y="455" font-size="23" fill="#b34b52" text-anchor="start" font-weight="700">C → B → A</text><rect x="275" y="425" width="270.0" height="65" rx="0" fill="#e4f5ed" stroke="#b34b52" stroke-width="2"/><text x="410.0" y="522" font-size="20" fill="#b34b52" text-anchor="middle" font-weight="400">A</text><rect x="545.0" y="425" width="90.0" height="65" rx="0" fill="#fff0ce" stroke="#b34b52" stroke-width="2"/><text x="590.0" y="522" font-size="20" fill="#b34b52" text-anchor="middle" font-weight="400">B</text><rect x="635.0" y="425" width="15.0" height="65" rx="0" fill="#e8f1fa" stroke="#b34b52" stroke-width="2"/><text x="642.5" y="522" font-size="20" fill="#b34b52" text-anchor="middle" font-weight="400">C</text><text x="275" y="563" font-size="21" fill="#61768a" text-anchor="start" font-weight="400">Σ（出現確率 × 比較回数）</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">高頻度順1.5回、低頻度順2.5回（説明用の例）</text></g></svg>