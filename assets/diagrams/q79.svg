<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title79"><title id="title79">問79 著作権で保護されるプログラム</title><defs><marker id="a79" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問79 著作権で保護されるプログラム</text><rect x="25" y="110" width="350" height="330" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="200" y="157" font-size="24" fill="#087f68" text-anchor="middle" font-weight="700">保護対象になり得る</text><text x="55" y="230" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">具体的なプログラム</text><text x="55" y="262" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">・コンパイラのコード</text><text x="55" y="294" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">・アプリのコード</text><text x="55" y="326" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">表現として創作された部分</text><rect x="425" y="110" width="350" height="330" rx="8" fill="#fff0ed" stroke="#b33b44" stroke-width="2"/><text x="600" y="157" font-size="23" fill="#b33b44" text-anchor="middle" font-weight="700">プログラムの規定で除外</text><text x="455" y="230" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">・プログラム言語</text><text x="455" y="262" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">・規約</text><text x="455" y="294" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">・解法（アルゴリズム）</text><text x="455" y="326" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">言語そのものは対象外</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">問79は保護されるものを選ぶ → 具体的なコンパイラのプログラム</text></g></svg>