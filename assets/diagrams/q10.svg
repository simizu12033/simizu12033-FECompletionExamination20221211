<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title10"><title id="v7title10">問10 再帰関数</title><desc>深く呼び出し、底から値を返す。基底条件 f(1)=1 から戻すと f(5)=15</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問10 再帰関数</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">深く呼び出し、底から値を返す</text><path d="M30 108H770" stroke="#cbdde9"/><text x="200" y="155" font-size="24" fill="#2872ae" text-anchor="middle" font-weight="700">呼出し ↓</text><text x="600" y="155" font-size="24" fill="#078268" text-anchor="middle" font-weight="700">戻り値 ↑</text><rect x="70" y="200" width="245" height="51" rx="5" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="90" y="234" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">f(5) = 5 + f(4)</text><text x="590" y="234" font-size="30" fill="#078268" text-anchor="middle" font-weight="700">15</text><path d="M425 245L425 272" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M425.0 272.0L419.3 260.3L430.7 260.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M670 272L670 240" stroke="#078268" stroke-width="3" fill="none"/><path d="M670.0 240.0L675.7 251.7L664.3 251.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="89" y="276" width="245" height="51" rx="5" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="109" y="310" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">f(4) = 4 + f(3)</text><text x="590" y="310" font-size="30" fill="#078268" text-anchor="middle" font-weight="700">10</text><path d="M425 321L425 348" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M425.0 348.0L419.3 336.3L430.7 336.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M670 348L670 316" stroke="#078268" stroke-width="3" fill="none"/><path d="M670.0 316.0L675.7 327.7L664.3 327.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="108" y="352" width="245" height="51" rx="5" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="128" y="386" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">f(3) = 3 + f(2)</text><text x="590" y="386" font-size="30" fill="#078268" text-anchor="middle" font-weight="700">6</text><path d="M425 397L425 424" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M425.0 424.0L419.3 412.3L430.7 412.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M670 424L670 392" stroke="#078268" stroke-width="3" fill="none"/><path d="M670.0 392.0L675.7 403.7L664.3 403.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="127" y="428" width="245" height="51" rx="5" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="147" y="462" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">f(2) = 2 + f(1)</text><text x="590" y="462" font-size="30" fill="#078268" text-anchor="middle" font-weight="700">3</text><path d="M425 473L425 500" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M425.0 500.0L419.3 488.3L430.7 488.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M670 500L670 468" stroke="#078268" stroke-width="3" fill="none"/><path d="M670.0 468.0L675.7 479.7L664.3 479.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="146" y="504" width="245" height="51" rx="5" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="166" y="538" font-size="23" fill="#16324f" text-anchor="start" font-weight="400">f(1) = 1</text><text x="590" y="538" font-size="30" fill="#078268" text-anchor="middle" font-weight="700">1</text><path d="M550 554H650" stroke="#078268" stroke-width="4" fill="none"/><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">基底条件 f(1)=1 から戻すと f(5)=15</text></g></svg>