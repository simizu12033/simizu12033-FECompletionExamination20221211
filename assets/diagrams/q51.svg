<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title51"><title id="v7title51">問51 プロジェクトライフサイクル</title><desc>不確実性は減り、後から変える負担は増えやすい。一般に、進行とともにリスクは低下する</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問51 プロジェクトライフサイクル</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">不確実性は減り、後から変える負担は増えやすい</text><path d="M30 108H770" stroke="#cbdde9"/><path d="M85 530L695 530" stroke="#16324f" stroke-width="3" fill="none"/><path d="M695.0 530.0L683.3 535.7L683.3 524.3Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><path d="M85 530L85 210" stroke="#16324f" stroke-width="3" fill="none"/><path d="M85.0 210.0L90.7 221.7L79.3 221.7Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><text x="695" y="566" font-size="19" fill="#16324f" text-anchor="end" font-weight="400">プロジェクトの進行</text><text x="85" y="190" font-size="19" fill="#16324f" text-anchor="start" font-weight="400"></text><path d="M85 215C250 225 440 485 695 505" stroke="#2872ae" stroke-width="4" fill="none"/><path d="M85 505C330 500 510 450 695 215" stroke="#b34b52" stroke-width="4" fill="none"/><text x="220" y="175" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="400">リスク・不確実性</text><text x="600" y="175" font-size="22" fill="#b34b52" text-anchor="middle" font-weight="400">変更コスト</text><g transform="translate(200 300) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-33 27C-65 25 -58 -16 -30 -17C-25 -53 24 -52 31 -22C65 -28 70 25 36 27Z" fill="white"/></g><g transform="translate(600 485) scale(0.23)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-33 27C-65 25 -58 -16 -30 -17C-25 -53 24 -52 31 -22C65 -28 70 25 36 27Z" fill="white"/></g><text x="400" y="601" font-size="22" fill="#61768a" text-anchor="middle" font-weight="400">2本の線は別の指標。上下を取り