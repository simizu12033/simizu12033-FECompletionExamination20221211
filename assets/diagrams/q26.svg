<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title26"><title id="title26">問26 エンティティと関係</title><defs><marker id="a26" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問26 エンティティと関係</text><rect x="25" y="120" width="230" height="235" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><rect x="25" y="120" width="230" height="55" rx="0" fill="#2563a6" stroke="#2563a6" stroke-width="2"/><text x="140" y="157" font-size="23" fill="white" text-anchor="middle" font-weight="700">部品（a）</text><text x="37" y="218" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">部品コード PK</text><text x="37" y="264" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">部品名</text><rect x="285" y="120" width="230" height="235" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><rect x="285" y="120" width="230" height="55" rx="0" fill="#2563a6" stroke="#2563a6" stroke-width="2"/><text x="400" y="157" font-size="23" fill="white" text-anchor="middle" font-weight="700">在庫（b）</text><text x="297" y="218" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">部品コード FK</text><text x="297" y="264" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">仕入先コード FK</text><text x="297" y="310" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">仕入日・価格・数量</text><rect x="545" y="120" width="230" height="235" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><rect x="545" y="120" width="230" height="55" rx="0" fill="#2563a6" stroke="#2563a6" stroke-width="2"/><text x="660" y="157" font-size="23" fill="white" text-anchor="middle" font-weight="700">仕入先（c）</text><text x="557" y="218" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">仕入先コード PK</text><text x="557" y="264" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">仕入先名</text><path d="M255 240 L285 240" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a26)"/><path d="M545 240 L515 240" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a26)"/><text x="263" y="205" font-size="17" fill="#16324f" text-anchor="middle" font-weight="400">1:多</text><text x="525" y="205" font-size="17" fill="#16324f" text-anchor="middle" font-weight="400">多:1</text><text x="400" y="430" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">1つの部品・仕入先に、日付の異なる在庫の記録が複数ある</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">a=部品、b=在庫、c=仕入先。中央に多側の記録を集める</text></g></svg>