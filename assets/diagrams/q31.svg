<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title31"><title id="v7title31">問31 ARP</title><desc>IPの持ち主をLAN全体に問い、MACを受け取る。ARP：同じIPv4リンクでIP → MACを解決する</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問31 ARP</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">IPの持ち主をLAN全体に問い、MACを受け取る</text><path d="M30 108H770" stroke="#cbdde9"/><g transform="translate(120 205) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-46" y="-34" width="92" height="62" rx="6" fill="white"/><path d="M0 29V44M-28 44H28" fill="none"/><path d="M-34 -22H34V14H-34Z" fill="#e8f1fa" stroke="none"/></g><text x="120" y="251.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">端末A</text><text x="120" y="272.6" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><g transform="translate(400 205) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-46" y="-34" width="92" height="62" rx="6" fill="white"/><path d="M0 29V44M-28 44H28" fill="none"/><path d="M-34 -22H34V14H-34Z" fill="#e8f1fa" stroke="none"/></g><text x="400" y="251.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">端末B</text><text x="400" y="272.6" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><g transform="translate(680 205) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-46" y="-34" width="92" height="62" rx="6" fill="white"/><path d="M0 29V44M-28 44H28" fill="none"/><path d="M-34 -22H34V14H-34Z" fill="#e8f1fa" stroke="none"/></g><text x="680" y="251.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">端末C</text><text x="680" y="272.6" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><path d="M60 370H740" stroke="#2872ae" stroke-width="5" fill="none"/><path d="M120 280V370" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M400 280V370" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M680 280V370" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M150 342L390 342" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M390.0 342.0L378.3 347.7L378.3 336.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><rect x="190.5" y="308.0" width="159" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="270.0" y="330.0" font-size="19" fill="#2872ae" text-anchor="middle" font-weight="400">① このIPは誰？</text><path d="M390 342L680 342" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M680.0 342.0L668.3 347.7L668.3 336.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><path d="M400 460L125 460" stroke="#078268" stroke-width="3" fill="none"/><path d="M125.0 460.0L136.7 454.3L136.7 465.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="187.0" y="426.0" width="151" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="262.5" y="448.0" font-size="19" fill="#078268" text-anchor="middle" font-weight="400">② 私のMACは…</text><text x="400" y="530" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">要求はブロードキャスト、応答は問い合わせ元へ</text><text x="400" y="585" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">ルータを越えた相手のMACを直接調べる仕組みではない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">ARP：同じIPv4リンクでIP → MACを解決する</text></g></svg>