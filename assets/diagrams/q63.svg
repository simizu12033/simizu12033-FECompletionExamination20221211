<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title63"><title id="v7title63">問63 BYOD</title><desc>自分の端末を、仕事へ持ち込んで使う。BYOD＝Bring Your Own Device</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問63 BYOD</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">自分の端末を、仕事へ持ち込んで使う</text><path d="M30 108H770" stroke="#cbdde9"/><circle cx="160" cy="300" r="110" fill="#e8f1fa" stroke="none" stroke-width="2.5"/><g transform="translate(120 270) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-25" r="17" fill="#fff0ce"/><path d="M-31 44V20Q-31 -2 0 -2Q31 -2 31 20V44" fill="white"/></g><text x="120" y="316.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">個人が所有</text><text x="120" y="337.6" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><g transform="translate(220 300) scale(0.7)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-26" y="-45" width="52" height="90" rx="9" fill="white"/><rect x="-17" y="-30" width="34" height="56" rx="2" fill="#e8f1fa" stroke="none"/><circle cy="35" r="3" fill="#078268"/></g><g transform="translate(650 285) scale(1.2)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-42 43V-35H42V43Z" fill="white"/><path d="M-16 43V17H16V43" fill="#e8f1fa"/><rect x="-27" y="-21" width="10" height="10" fill="#e8f1fa"/><rect x="-27" y="-1" width="10" height="10" fill="#e8f1fa"/><rect x="-5" y="-21" width="10" height="10" fill="#e8f1fa"/><rect x="-5" y="-1" width="10" height="10" fill="#e8f1fa"/><rect x="17" y="-21" width="10" height="10" fill="#e8f1fa"/><rect x="17" y="-1" width="10" height="10" fill="#e8f1fa"/></g><text x="650" y="371.4" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">勤務先の業務</text><text x="650" y="409.8" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><path d="M280 300L550 300" stroke="#078268" stroke-width="3" fill="none"/><path d="M550.0 300.0L538.3 305.7L538.3 294.3Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="361.5" y="266.0" width="107" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="415.0" y="288.0" font-size="19" fill="#078268" text-anchor="middle" font-weight="400">業務で利用</text><g transform="translate(410 265) scale(0.5)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-26" y="-45" width="52" height="90" rx="9" fill="white"/><rect x="-17" y="-30" width="34" height="56" rx="2" fill="#e8f1fa" stroke="none"/><circle cy="35" r="3" fill="#078268"/></g><text x="400" y="515" font-size="29" fill="#078268" text-anchor="middle" font-weight="700">所有者は個人、利用目的は業務</text><text x="400" y="580" font-size="23" fill="#61768a" text-anchor="middle" font-weight="400">会社の端末を私用で使う意味ではない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">BYOD＝Bring Your Own Device</text></g></svg>