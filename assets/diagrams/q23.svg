<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title23"><title id="v7title23">問23 会話インタフェース</title><desc>普段の言葉で伝え、足りない条件を聞き返す。自然な文章・発話による対話 → 自然言語インタフェース</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問23 会話インタフェース</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">普段の言葉で伝え、足りない条件を聞き返す</text><path d="M30 108H770" stroke="#cbdde9"/><g transform="translate(90 220) scale(0.75)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-25" r="17" fill="#fff0ce"/><path d="M-31 44V20Q-31 -2 0 -2Q31 -2 31 20V44" fill="white"/></g><text x="90" y="274.0" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">利用者</text><text x="90" y="298.0" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><g transform="translate(685 440) scale(0.75)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-46" y="-34" width="92" height="62" rx="6" fill="white"/><path d="M0 29V44M-28 44H28" fill="none"/><path d="M-34 -22H34V14H-34Z" fill="#e8f1fa" stroke="none"/></g><text x="685" y="494.0" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">システム</text><text x="685" y="518.0" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><path d="M190 155H720V285H215L175 315L190 270Z" stroke="#2872ae" stroke-width="2" fill="white"/><text x="220" y="203" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">「名古屋から東京まで、</text><text x="220" y="235" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">大人2名でお願いします」</text><path d="M80 365H570V480L610 505L555 495H80Z" stroke="#078268" stroke-width="2" fill="#e4f5ed"/><text x="110" y="412" font-size="23" fill="#078268" text-anchor="start" font-weight="400">「何時ごろ乗車されますか？」</text><text x="110" y="444" font-size="23" fill="#078268" text-anchor="start" font-weight="400">必要な条件を会話で補う</text><text x="400" y="590" font-size="23" fill="#61768a" text-anchor="middle" font-weight="400">専用コマンドの書式を覚える負担を減らす</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">自然な文章・発話による対話 → 自然言語インタフェース</text></g></svg>