<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title4"><title id="title4">問4 3乗に比例する計算時間</title><defs><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問4 3乗に比例する計算時間</text><rect x="50" y="100" width="200" height="62" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="138.0" font-size="20" fill="white" text-anchor="middle" font-weight="700">項目</text><rect x="250" y="100" width="230" height="62" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="365.0" y="138.0" font-size="20" fill="white" text-anchor="middle" font-weight="700">元の条件</text><rect x="480" y="100" width="270" height="62" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="138.0" font-size="20" fill="white" text-anchor="middle" font-weight="700">変更後</text><rect x="50" y="162" width="200" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="200.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">未知数の数</text><rect x="250" y="162" width="230" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="365.0" y="200.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">100</text><rect x="480" y="162" width="270" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="200.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">1000（10倍）</text><rect x="50" y="224" width="200" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="262.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">計算量</text><rect x="250" y="224" width="230" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="365.0" y="262.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">1</text><rect x="480" y="224" width="270" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="262.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">10³ = 1000倍</text><rect x="50" y="286" width="200" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="324.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">演算速度</text><rect x="250" y="286" width="230" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="365.0" y="324.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">1</text><rect x="480" y="286" width="270" height="62" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="324.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">4倍</text><rect x="50" y="348" width="200" height="62" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="150.0" y="386.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">計算時間</text><rect x="250" y="348" width="230" height="62" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="365.0" y="386.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">2秒</text><rect x="480" y="348" width="270" height="62" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="615.0" y="386.0" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">2×1000÷4 = 500秒</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">計算量の増加は掛ける、速度の向上は割る</text></g></svg>