<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title46"><title id="v7title46">問46 カプセル化</title><desc>操作の窓口だけを公開し、内部データを守る。データと操作を一体化し、内部を隠す → カプセル化</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問46 カプセル化</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">操作の窓口だけを公開し、内部データを守る</text><path d="M30 108H770" stroke="#cbdde9"/><rect x="300" y="175" width="445" height="380" rx="30" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="522" y="217" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">銀行口座オブジェクト</text><g transform="translate(525 360) scale(1.05)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-33" y="-6" width="66" height="53" rx="7" fill="#fff0ce"/><path d="M-23 -6V-26Q-23 -48 0 -48Q23 -48 23 -26V-6" fill="none"/><circle cy="16" r="5" fill="#16324f"/><path d="M0 21V32"/></g><text x="525" y="464" font-size="26" fill="#078268" text-anchor="middle" font-weight="700">内部：残高</text><g transform="translate(105 300) scale(0.7)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-25" r="17" fill="#fff0ce"/><path d="M-31 44V20Q-31 -2 0 -2Q31 -2 31 20V44" fill="white"/></g><text x="105" y="350.4" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">外部の処理</text><text x="105" y="372.8" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400"></text><path d="M165 300L330 270" stroke="#078268" stroke-width="3" fill="none"/><path d="M330.0 270.0L319.5 277.7L317.5 266.5Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="194.0" y="251.0" width="107" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="247.5" y="273.0" font-size="19" fill="#078268" text-anchor="middle" font-weight="400">入金・出金</text><path d="M185 430H315" stroke="#b34b52" stroke-width="4" fill="none"/><path d="M240 409L280 451M280 409L240 451" stroke="#b34b52" stroke-width="4" fill="none"/><text x="170" y="520" font-size="21" fill="#b34b52" text-anchor="middle" font-weight="400">残高を直接変更させない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">データと操作を一体化し、内部を隠す → カプセル化</text></g></svg>