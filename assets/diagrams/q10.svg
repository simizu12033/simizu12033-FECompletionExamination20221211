<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title10"><title id="title10">問10 再帰関数</title><defs><marker id="a10" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問10 再帰関数</text><text x="65" y="100" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">f(5)=5+f(4)</text><text x="485" y="100" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">5+10=15</text><path d="M380 106 L380 143" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><path d="M460 143 L460 106" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><text x="79" y="172" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">f(4)=4+f(3)</text><text x="485" y="172" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">4+6=10</text><path d="M380 178 L380 215" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><path d="M460 215 L460 178" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><text x="93" y="244" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">f(3)=3+f(2)</text><text x="485" y="244" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">3+3=6</text><path d="M380 250 L380 287" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><path d="M460 287 L460 250" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><text x="107" y="316" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">f(2)=2+f(1)</text><text x="485" y="316" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">2+1=3</text><path d="M380 322 L380 359" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><path d="M460 359 L460 322" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a10)"/><text x="121" y="388" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">f(1)=1</text><text x="485" y="388" font-size="24" fill="#087f68" text-anchor="start" font-weight="400">基底条件：1</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">呼出しを深め、f(1)=1から戻り値を積み上げる → 15</text></g></svg>