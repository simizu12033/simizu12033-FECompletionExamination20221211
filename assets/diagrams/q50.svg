<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title50"><title id="v7title50">問50 バーンダウンチャート</title><desc>時間が進むと、残っている作業が減る。縦軸は累積実績ではなく「残作業量」</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問50 バーンダウンチャート</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">時間が進むと、残っている作業が減る</text><path d="M30 108H770" stroke="#cbdde9"/><path d="M85 530L695 530" stroke="#16324f" stroke-width="3" fill="none"/><path d="M695.0 530.0L683.3 535.7L683.3 524.3Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><path d="M85 530L85 200" stroke="#16324f" stroke-width="3" fill="none"/><path d="M85.0 200.0L90.7 211.7L79.3 211.7Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><text x="695" y="566" font-size="19" fill="#16324f" text-anchor="end" font-weight="400">時間</text><text x="85" y="180" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">残作業量</text><path d="M85 205L695 530" stroke="#61768a" stroke-width="2" fill="none" stroke-dasharray="8 6"/><path d="M85 205L180 250L280 272L380 369L485 392L590 475L695 518" stroke="#078268" stroke-width="5" fill="none"/><text x="530" y="205" font-size="22" fill="#61768a" text-anchor="start" font-weight="400">点線：理想</text><text x="530" y="246" font-size="22" fill="#078268" text-anchor="start" font-weight="400">実線：実績</text><g transform="translate(205 415) scale(0.45)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><circle cx="260" cy="440" r="23" fill="#e4f5ed" stroke="#078268" stroke-width="2.5"/><text x="260" y="447" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">✓</text><text x="400" y="595" font-size="23" fill="#078268" text-anchor="middle" font-weight="400">終わった作業の分だけ「残り」が下がる</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">縦軸は累積実績ではなく「残作業量」</text></g></svg>