<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title74"><title id="title74">問74 機械学習の産業利用の解説図</title><rect width="800" height="650" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="28" y="42" font-size="25" fill="#16324f">問74  機械学習の産業利用</text><rect x="28" y="80" width="744" height="104" rx="10" fill="#edf4fb" stroke="#b7c9dc"/><text x="48" y="114" font-size="21" fill="#16324f">1. 正常音を学習</text><path d="M400 188 v12 m-7 -7 7 7 7 -7" fill="none" stroke="#087f68" stroke-width="3"/><rect x="28" y="205" width="744" height="104" rx="10" fill="#edf4fb" stroke="#b7c9dc"/><text x="48" y="239" font-size="21" fill="#16324f">2. 実際の音を比較</text><path d="M400 313 v12 m-7 -7 7 7 7 -7" fill="none" stroke="#087f68" stroke-width="3"/><rect x="28" y="330" width="744" height="104" rx="10" fill="#dcf3e9" stroke="#b7c9dc"/><text x="48" y="364" font-size="21" fill="#16324f">3. 異常の兆候を検出</text><text x="32" y="610" font-size="18" fill="#087f68">正解 ウ：正常な稼働音を学習し異音で異常を検知</text></g></svg>