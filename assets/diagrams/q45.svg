<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title45"><title id="v7title45">問45 E-R図</title><desc>データの対象と、「1対多」の関連を表す。E-R図はデータの構造。処理の順序を示す図ではない</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問45 E-R図</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">データの対象と、「1対多」の関連を表す</text><path d="M30 108H770" stroke="#cbdde9"/><g transform="translate(140 240) scale(0.85)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-25" r="17" fill="#fff0ce"/><path d="M-31 44V20Q-31 -2 0 -2Q31 -2 31 20V44" fill="white"/></g><text x="140" y="301.2" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">顧客</text><text x="140" y="328.4" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400">顧客番号・氏名</text><g transform="translate(660 170) scale(0.55)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="660" y="232" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">注文001</text><path d="M220 310L600 170" stroke="#078268" stroke-width="3" fill="none"/><path d="M600.0 170.0L591.0 179.4L587.1 168.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><g transform="translate(660 340) scale(0.55)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="660" y="402" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">注文002</text><path d="M220 310L600 340" stroke="#078268" stroke-width="3" fill="none"/><path d="M600.0 340.0L587.9 344.7L588.8 333.4Z" stroke="#078268" stroke-width="1" fill="#078268"/><g transform="translate(660 510) scale(0.55)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="660" y="572" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">注文003</text><path d="M220 310L600 510" stroke="#078268" stroke-width="3" fill="none"/><path d="M600.0 510.0L587.0 509.6L592.3 499.5Z" stroke="#078268" stroke-width="1" fill="#078268"/><text x="365" y="240" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">1人の顧客</text><text x="400" y="410" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">複数の注文</text><text x="240" y="570" font-size="21" fill="#61768a" text-anchor="middle" font-weight="400">注文には顧客番号を持たせて対応付ける</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">E-R図はデータの構造。処理の順序を示す図ではない</text></g></svg>