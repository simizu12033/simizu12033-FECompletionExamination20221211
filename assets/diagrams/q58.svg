<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title58"><title id="title58">問58 監査のウォークスルー法</title><defs><marker id="a58" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問58 監査のウォークスルー法</text><rect x="25" y="120" width="220" height="70" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="37" y="150" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">入力</text><text x="135" y="245" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">申請・原始データ</text><path d="M245 155 L290 155" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a58)"/><rect x="290" y="120" width="220" height="70" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="302" y="150" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">処理</text><text x="400" y="245" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">照合・承認</text><path d="M510 155 L555 155" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a58)"/><rect x="555" y="120" width="220" height="70" rx="8" fill="#edf4fb" stroke="#2563a6" stroke-width="2"/><text x="567" y="150" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">出力・活用</text><text x="665" y="245" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">帳票・判断</text><path d="M80 320 L720 320" fill="none" stroke="#087f68" stroke-width="5" marker-end="url(#a58)"/><text x="400" y="365" font-size="24" fill="#087f68" text-anchor="middle" font-weight="400">監査人が書類上、または実際に流れをたどる</text><text x="400" y="425" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">各段階で承認・照合などの統制が働くか確認する</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">ウォークスルー：1件のデータ等を処理の流れに沿って追跡する</text></g></svg>