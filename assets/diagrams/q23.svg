<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title23"><title id="title23">問23 会話インタフェース</title><defs><marker id="a23" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問23 会話インタフェース</text><circle cx="85" cy="160" r="35" fill="#dcf3e9" stroke="#2563a6" stroke-width="3"/><path d="M35 290 V235 Q85 175 135 235 V290" fill="none" stroke="#2563a6" stroke-width="3"/><rect x="195" y="95" width="550" height="110" rx="18" fill="white" stroke="#2563a6" stroke-width="2"/><text x="220" y="133" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">「5月28日の名古屋駅から東京駅まで、</text><text x="220" y="165" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">大人2名でお願いします」</text><rect x="195" y="255" width="550" height="110" rx="18" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="220" y="293" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">「何時ごろ乗車されますか？」</text><text x="220" y="325" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">→ 自然な言葉で条件を確認</text><path d="M150 180 L195 150" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a23)"/><path d="M195 310 L150 270" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a23)"/><text x="400" y="440" font-size="22" fill="#16324f" text-anchor="middle" font-weight="400">コマンドの書式を覚える代わりに、普段の言葉で伝える</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">自然言語インタフェース＝日常の文章や発話による対話</text></g></svg>