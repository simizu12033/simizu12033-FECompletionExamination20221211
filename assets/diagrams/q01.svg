<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title1"><title id="title1">問1 桁落ち</title><defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問1 桁落ち</text><rect x="60" y="105" width="680" height="150" rx="8" fill="white" stroke="#b7c9dc" stroke-width="2"/><rect x="134" y="119" width="287" height="117" rx="8" fill="#fff0c7" stroke="none" stroke-width="2"/><text x="85" y="153" font-size="42" fill="#16324f" text-anchor="start" font-weight="400">  1.234567</text><text x="85" y="214" font-size="42" fill="#16324f" text-anchor="start" font-weight="400">− 1.234561</text><path d="M85 232 L600 232" fill="none" stroke="#16324f" stroke-width="2"/><text x="85" y="302" font-size="42" fill="#087f68" text-anchor="start" font-weight="400">  0.000006</text><path d="M170 124 L415 222" fill="none" stroke="#b33b44" stroke-width="4"/><text x="460" y="168" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">共通の上位桁が</text><text x="460" y="204" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">引き算で消える</text><text x="70" y="365" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">例：近い値の差では、もとの数に多くの桁があっても、残る有効</text><text x="70" y="396" font-size="21" fill="#16324f" text-anchor="start" font-weight="400">桁は少なくなる。</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">桁落ち＝ほぼ等しい値の減算による精度低下</text></g></svg>