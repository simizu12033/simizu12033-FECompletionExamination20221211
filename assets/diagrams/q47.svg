<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title47"><title id="title47">問47 平均比較回数</title><defs><marker id="a47" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問47 平均比較回数</text><text x="400" y="100" font-size="25" fill="#16324f" text-anchor="middle" font-weight="700">例：A=60％、B=30％、C=10％</text><rect x="35" y="145" width="190" height="68" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="186.0" font-size="19" fill="white" text-anchor="middle" font-weight="700">順序</text><rect x="225" y="145" width="180" height="68" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="315.0" y="186.0" font-size="19" fill="white" text-anchor="middle" font-weight="700">Aの比較回数</text><rect x="405" y="145" width="180" height="68" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="495.0" y="186.0" font-size="19" fill="white" text-anchor="middle" font-weight="700">Bの比較回数</text><rect x="585" y="145" width="180" height="68" rx="0" fill="#2563a6" stroke="#b7c9dc" stroke-width="2"/><text x="675.0" y="186.0" font-size="19" fill="white" text-anchor="middle" font-weight="700">Cの比較回数</text><rect x="35" y="213" width="190" height="68" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="254.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">A→B→C</text><rect x="225" y="213" width="180" height="68" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="315.0" y="254.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">1</text><rect x="405" y="213" width="180" height="68" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="495.0" y="254.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">2</text><rect x="585" y="213" width="180" height="68" rx="0" fill="#dcf3e9" stroke="#b7c9dc" stroke-width="2"/><text x="675.0" y="254.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">3</text><rect x="35" y="281" width="190" height="68" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="130.0" y="322.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">C→B→A</text><rect x="225" y="281" width="180" height="68" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="315.0" y="322.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">3</text><rect x="405" y="281" width="180" height="68" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="495.0" y="322.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">2</text><rect x="585" y="281" width="180" height="68" rx="0" fill="white" stroke="#b7c9dc" stroke-width="2"/><text x="675.0" y="322.0" font-size="19" fill="#16324f" text-anchor="middle" font-weight="400">1</text><rect x="45" y="385" width="710" height="68" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="428" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">高頻度順：0.6×1 + 0.3×2 + 0.1×3 = 1.5回</text><text x="400" y="478" font-size="21" fill="#b33b44" text-anchor="middle" font-weight="400">逆順では0.6×3 + 0.3×2 + 0.1×1 = 2.5回</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">出現比率の高い区分から調べるほど、平均比較回数が少ない</text></g></svg>