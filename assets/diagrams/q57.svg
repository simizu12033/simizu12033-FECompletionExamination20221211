<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title57"><title id="title57">問57 運用におけるデータ処理</title><defs><marker id="a57" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問57 運用におけるデータ処理</text><rect x="65" y="125" width="180" height="80" rx="8" fill="#dcf3e9" stroke="#2563a6" stroke-width="2"/><text x="77" y="155" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">入力</text><path d="M245 165 L310 165" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a57)"/><rect x="310" y="125" width="180" height="80" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><text x="322" y="155" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">処理</text><path d="M490 165 L555 165" fill="none" stroke="#2563a6" stroke-width="3" marker-end="url(#a57)"/><rect x="555" y="125" width="180" height="80" rx="8" fill="white" stroke="#2563a6" stroke-width="2"/><text x="567" y="155" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">出力</text><path d="M635 300 L155 300" fill="none" stroke="#b33b44" stroke-width="4" marker-end="url(#a57)"/><text x="395" y="280" font-size="22" fill="#b33b44" text-anchor="middle" font-weight="400">出力後に発見すると、広い範囲をやり直す</text><path d="M155 210 V250 H235 V210" fill="none" stroke="#087f68" stroke-width="4"/><text x="270" y="240" font-size="21" fill="#087f68" text-anchor="start" font-weight="400">入力時のチェックなら早く修正できる</text><text x="400" y="410" font-size="23" fill="#087f68" text-anchor="middle" font-weight="400">エ：入力段階で行う方が、検出・修正の効率がよい</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">適切な記述を選ぶ問題。入力に近い段階で誤りを見つける</text></g></svg>