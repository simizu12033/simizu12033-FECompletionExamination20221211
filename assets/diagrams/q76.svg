<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title76"><title id="v7title76">問76 線形計画法の定式化</title><desc>資源の上限を守る範囲で、利益を最大化する。4x+8y≤40、9x+6y≤54、x,y≥0 ／ 利益2x+3y</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問76 線形計画法の定式化</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">資源の上限を守る範囲で、利益を最大化する</text><path d="M30 108H770" stroke="#cbdde9"/><path d="M95 530L605 530" stroke="#16324f" stroke-width="3" fill="none"/><path d="M605.0 530.0L593.3 535.7L593.3 524.3Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><path d="M95 530L95 210" stroke="#16324f" stroke-width="3" fill="none"/><path d="M95.0 210.0L100.7 221.7L89.3 221.7Z" stroke="#16324f" stroke-width="1" fill="#16324f"/><text x="605" y="566" font-size="19" fill="#16324f" text-anchor="end" font-weight="400">製品A x</text><text x="95" y="190" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">製品B y</text><path d="M95 530L485 530L355 395L95 305Z" stroke="#078268" stroke-width="2" fill="#e4f5ed"/><path d="M95 305L550 462.5" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M225 260L485 530" stroke="#b34b52" stroke-width="3" fill="none"/><circle cx="95" cy="305" r="5" fill="#078268" stroke="#078268" stroke-width="2.5"/><text x="105" y="293" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">(0,5)</text><circle cx="485" cy="530" r="5" fill="#078268" stroke="#078268" stroke-width="2.5"/><text x="495" y="518" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">(6,0)</text><circle cx="355" cy="395" r="5" fill="#078268" stroke="#078268" stroke-width="2.5"/><text x="365" y="383" font-size="19" fill="#16324f" text-anchor="start" font-weight="400">(4,3)</text><text x="620" y="220" font-size="20" fill="#61768a" text-anchor="start" font-weight="400">青：原料P</text><text x="620" y="252" font-size="20" fill="#61768a" text-anchor="start" font-weight="400">赤：原料Q</text><text x="300" y="470" font-size="23" fill="#078268" text-anchor="middle" font-weight="700">実行可能</text><text x="400" y="603" font-size="23" fill="#61768a" text-anchor="middle" font-weight="400">利益の式と、資源制約の式を混同しない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">4x+8y≤40、9x+6y≤54、x,y≥0 ／ 利益2x+3y</text></g></svg>