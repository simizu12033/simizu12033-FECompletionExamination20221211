<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1320" role="img" aria-labelledby="protocol-title protocol-desc"><title id="protocol-title">問32 4つのプロトコルは何を運ぶ？</title><desc id="protocol-desc">DHCPは設定配布、ICMPはpingの要求と応答、SMTPはメール転送、SNMPは機器の監視管理。端末とサーバのアイコン及び方向の異なる矢印で通信を比較する。</desc><defs><marker id="p32-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2872ae"/></marker><marker id="p32-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#078268"/></marker><marker id="p32-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b36218"/></marker></defs><rect width="800" height="1320" rx="20" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif" fill="#16324f"><text x="32" y="48" font-size="29" font-weight="700">同じネットワークでも、運ぶものが違う</text><text x="32" y="83" font-size="21" fill="#526c80">問32｜pingを実現するのは、どの通信？</text><path d="M26 108H774" stroke="#c7d8e5" stroke-width="2"/><text x="38" y="148" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">DHCP</text><text x="170" y="147" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">接続した端末へ「設定を配る」</text><text x="38" y="180" font-size="19" fill="#526c80" text-anchor="start" font-weight="400">Dynamic Host Configuration Protocol</text><g transform="translate(125 260)"><rect x="-48" y="-38" width="96" height="64" rx="6" fill="#e2f0fc" stroke="#2872ae" stroke-width="3"/><path d="M-40 -29H40V17H-40Z" fill="white"/><path d="M0 27V45M-32 45H32" stroke="#2872ae" stroke-width="5"/><circle cx="0" cy="-6" r="11" fill="#b8d5ed"/></g><g transform="translate(665 260)"><rect x="-35" y="-48" width="70" height="99" rx="7" fill="#e3edf5" stroke="#2872ae" stroke-width="3"/><rect x="-25" y="-36" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="-27" r="3" fill="#078268"/><rect x="-25" y="-8" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="1" r="3" fill="#078268"/><rect x="-25" y="20" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="29" r="3" fill="#078268"/></g><path d="M225 249H565" fill="none" stroke="#2872ae" stroke-width="4" marker-end="url(#p32-blue)"/><text x="395" y="235" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">設定がほしい</text><path d="M565 290H225" fill="none" stroke="#b36218" stroke-width="4" marker-end="url(#p32-orange)"/><text x="395" y="320" font-size="21" fill="#b36218" text-anchor="middle" font-weight="400">IPアドレスなどを配布</text><text x="125" y="329" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">PC</text><text x="665" y="329" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">DHCPサーバ</text><path d="M26 358H774" stroke="#c7d8e5" stroke-width="2"/><rect x="16" y="365" width="768" height="285" rx="16" fill="#e7f7ef" stroke="#078268" stroke-width="2"/><text x="38" y="398" font-size="28" fill="#078268" text-anchor="start" font-weight="700">ICMP</text><text x="170" y="397" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">pingの「行って、戻る」を確かめる</text><text x="38" y="430" font-size="19" fill="#526c80" text-anchor="start" font-weight="400">Internet Control Message Protocol</text><g transform="translate(125 508)"><rect x="-48" y="-38" width="96" height="64" rx="6" fill="#e2f0fc" stroke="#2872ae" stroke-width="3"/><path d="M-40 -29H40V17H-40Z" fill="white"/><path d="M0 27V45M-32 45H32" stroke="#2872ae" stroke-width="5"/><circle cx="0" cy="-6" r="11" fill="#b8d5ed"/></g><g transform="translate(665 508)"><rect x="-35" y="-48" width="70" height="99" rx="7" fill="#e3edf5" stroke="#2872ae" stroke-width="3"/><rect x="-25" y="-36" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="-27" r="3" fill="#078268"/><rect x="-25" y="-8" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="1" r="3" fill="#078268"/><rect x="-25" y="20" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="29" r="3" fill="#078268"/></g><path d="M225 490H565" fill="none" stroke="#078268" stroke-width="4" marker-end="url(#p32-green)"/><text x="395" y="477" font-size="21" fill="#078268" text-anchor="middle" font-weight="400">① Echo Request（要求）</text><path d="M565 536H225" fill="none" stroke="#078268" stroke-width="4" marker-end="url(#p32-green)"/><text x="395" y="568" font-size="21" fill="#078268" text-anchor="middle" font-weight="400">② Echo Reply（応答）</text><text x="125" y="585" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">送信元</text><text x="665" y="585" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">確認する相手</text><text x="400" y="624" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">Control Message＝通信の状態・エラーを知らせる</text><path d="M26 666H774" stroke="#c7d8e5" stroke-width="2"/><text x="38" y="706" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">SMTP</text><text x="170" y="705" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">メールを「送る・中継する」</text><text x="38" y="738" font-size="19" fill="#526c80" text-anchor="start" font-weight="400">Simple Mail Transfer Protocol</text><g transform="translate(125 820)"><rect x="-35" y="-48" width="70" height="99" rx="7" fill="#e3edf5" stroke="#2872ae" stroke-width="3"/><rect x="-25" y="-36" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="-27" r="3" fill="#078268"/><rect x="-25" y="-8" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="1" r="3" fill="#078268"/><rect x="-25" y="20" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="29" r="3" fill="#078268"/></g><g transform="translate(665 820)"><rect x="-35" y="-48" width="70" height="99" rx="7" fill="#e3edf5" stroke="#2872ae" stroke-width="3"/><rect x="-25" y="-36" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="-27" r="3" fill="#078268"/><rect x="-25" y="-8" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="1" r="3" fill="#078268"/><rect x="-25" y="20" width="50" height="19" rx="3" fill="white"/><circle cx="17" cy="29" r="3" fill="#078268"/></g><path d="M230 812H560" fill="none" stroke="#2872ae" stroke-width="4" marker-end="url(#p32-blue)"/><text x="395" y="779" font-size="23" fill="#16324f" text-anchor="middle" font-weight="700">Mail Transfer</text><g transform="translate(364 795)"><rect width="62" height="38" rx="3" fill="#fff3d5" stroke="#b36218" stroke-width="2"/><path d="M0 0L31 24L62 0" fill="none" stroke="#b36218" stroke-width="2"/></g><text x="125" y="888" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">送信側サーバ</text><text x="665" y="888" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">受信側サーバ</text><path d="M26 922H774" stroke="#c7d8e5" stroke-width="2"/><text x="38" y="962" font-size="28" fill="#16324f" text-anchor="start" font-weight="700">SNMP</text><text x="170" y="961" font-size="24" fill="#16324f" text-anchor="start" font-weight="700">ネットワーク機器を「監視・管理」</text><text x="38" y="994" font-size="19" fill="#526c80" text-anchor="start" font-weight="400">Simple Network Management Protocol</text><g transform="translate(125 1074)"><rect x="-48" y="-38" width="96" height="64" rx="6" fill="#e2f0fc" stroke="#2872ae" stroke-width="3"/><path d="M-40 -29H40V17H-40Z" fill="white"/><path d="M0 27V45M-32 45H32" stroke="#2872ae" stroke-width="5"/><circle cx="0" cy="-6" r="11" fill="#b8d5ed"/></g><g transform="translate(665 1074)"><path d="M-51 -26H51V28H-51Z" fill="#e2f0fc" stroke="#2872ae" stroke-width="3"/><path d="M-24 -10H24M24 -10L15 -18M24 -10L15 -2M24 12H-24M-24 12L-15 4M-24 12L-15 20" fill="none" stroke="#2872ae" stroke-width="3"/><circle cx="-34" cy="38" r="4" fill="#078268"/><circle cx="-19" cy="38" r="4" fill="#078268"/></g><path d="M225 1049H565" fill="none" stroke="#2872ae" stroke-width="4" marker-end="url(#p32-blue)"/><text x="395" y="1035" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">通信量・状態を問い合わせ</text><path d="M565 1092H225" fill="none" stroke="#b36218" stroke-width="4" marker-end="url(#p32-orange)"/><text x="395" y="1122" font-size="21" fill="#b36218" text-anchor="middle" font-weight="400">管理情報を返す</text><text x="125" y="1150" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">管理端末</text><text x="665" y="1150" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">ルータ・スイッチ</text><text x="400" y="1190" font-size="22" fill="#16324f" text-anchor="middle" font-weight="700">Network Management＝機器の管理</text><path d="M26 1220H774" stroke="#c7d8e5"/><text x="400" y="1255" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">設定：DHCP　／　ping：ICMP</text><text x="400" y="1292" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">メール：SMTP　／　機器管理：SNMP</text></g></svg>