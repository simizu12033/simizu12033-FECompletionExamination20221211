oke="white" stroke-width="2"/><text x="65" y="240" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">7時</text><text x="488" y="240" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">16時</text><text x="629" y="240" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">19時</text><text x="723" y="240" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">21時</text><text x="276" y="333" font-size="27" fill="#078268" text-anchor="middle" font-weight="700">稼働9時間</text><text x="558" y="318" font-size="23" fill="#b34b52" text-anchor="middle" font-weight="400">停止</text><text x="558" y="353" font-size="21" fill="#b34b52" text-anchor="middle" font-weight="400">3時間</text><text x="677" y="417" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">提供</text><text x="677" y="449" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">時間外</text><path d="M65 420V440H629V420" stroke="#2872ae" stroke-width="3" fill="none"/><text x="345" y="488" font-size="26" fill="#2872ae" text-anchor="middle" font-weight="700">分母はここ：12時間</text><text x="400" y="590" font-size="23" fill="#61768a" text-anchor="middle" font-weight="400">19時以降の修理時間を分母へ加えない</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">稼働9時間 ÷ 提供12時間 = 75％</text></g></svg>