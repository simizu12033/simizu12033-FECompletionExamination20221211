<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title78"><title id="v7title78">問78 損益計算書の営業利益</title><desc>差し引く段階によって、利益の名前が変わる。営業利益＝1500−1000−200＝300百万円</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問78 損益計算書の営業利益</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">差し引く段階によって、利益の名前が変わる</text><path d="M30 108H770" stroke="#cbdde9"/><rect x="42" y="210.0" width="96" height="330.0" rx="3" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="90" y="195.0" font-size="25" fill="#2872ae" text-anchor="middle" font-weight="700">1500</text><text x="90" y="580" font-size="21" fill="#2872ae" text-anchor="middle" font-weight="700">売上高</text><rect x="342" y="430.0" width="96" height="110.0" rx="3" fill="#e8f1fa" stroke="#2872ae" stroke-width="2"/><text x="390" y="415.0" font-size="25" fill="#2872ae" text-anchor="middle" font-weight="700">500</text><text x="390" y="580" font-size="21" fill="#2872ae" text-anchor="middle" font-weight="700">売上総利益</text><rect x="602" y="474.0" width="96" height="66.0" rx="3" fill="#e4f5ed" stroke="#078268" stroke-width="2"/><text x="650" y="459.0" font-size="25" fill="#078268" text-anchor="middle" font-weight="700">300</text><text x="650" y="580" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">営業利益</text><path d="M150 260L330 390" stroke="#b34b52" stroke-width="3" fill="none"/><path d="M330.0 390.0L317.2 387.7L323.8 378.6Z" stroke="#b34b52" stroke-width="1" fill="#b34b52"/><rect x="164.5" y="291.0" width="151" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="240.0" y="313.0" font-size="19" fill="#b34b52" text-anchor="middle" font-weight="400">原価1000を引く</text><path d="M450 430L590 470" stroke="#b34b52" stroke-width="3" fill="none"/><path d="M590.0 470.0L577.2 472.2L580.3 461.3Z" stroke="#b34b52" stroke-width="1" fill="#b34b52"/><rect x="440.5" y="416.0" width="159" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="520.0" y="438.0" font-size="19" fill="#b34b52" text-anchor="middle" font-weight="400">販管費200を引く</text><text x="400" y="166" font-size="21" fill="#61768a" text-anchor="middle" font-weight="400">単位：百万円</text><text x="400" y="610" font-size="20" fill="#61768a" text-anchor="middle" font-weight="400">さらに営業外 +40−30 まで進むと経常利益310</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">営業利益＝1500−1000−200＝300百万円</text></g></svg>