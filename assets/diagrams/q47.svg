<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title47"><title id="title47">問47 平均比較回数の解説図</title><rect width="800" height="650" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="28" y="42" font-size="25" fill="#16324f">問47  平均比較回数</text><rect x="28" y="80" width="744" height="104" rx="10" fill="#edf4fb" stroke="#b7c9dc"/><text x="48" y="114" font-size="21" fill="#16324f">1. 高頻度を先に判定</text><path d="M400 188 v12 m-7 -7 7 7 7 -7" fill="none" stroke="#087f68" stroke-width="3"/><rect x="28" y="205" width="744" height="104" rx="10" fill="#edf4fb" stroke="#b7c9dc"/><text x="48" y="239" font-size="21" fill="#16324f">2. 早期終了が増加</text><path d="M400 313 v12 m-7 -7 7 7 7 -7" fill="none" stroke="#087f68" stroke-width="3"/><rect x="28" y="330" width="744" height="104" rx="10" fill="#dcf3e9" stroke="#b7c9dc"/><text x="48" y="364" font-size="21" fill="#16324f">3. 平均比較回数が減少</text><text x="32" y="610" font-size="18" fill="#087f68">正解 イ：出現比率の高い区分から判定</text></g></svg>