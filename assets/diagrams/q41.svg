<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="title41"><title id="title41">問41 SQLインジェクション対策</title><defs><marker id="a41" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="620" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問41 SQLインジェクション対策</text><rect x="30" y="100" width="740" height="175" rx="8" fill="#fff0ed" stroke="#b33b44" stroke-width="2"/><text x="55" y="140" font-size="24" fill="#b33b44" text-anchor="start" font-weight="700">危険：入力をSQL文字列へそのまま連結</text><text x="55" y="190" font-size="25" fill="#16324f" text-anchor="start" font-weight="400">入力： &#x27; OR &#x27;1&#x27;=&#x27;1</text><text x="55" y="235" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">入力した記号がSQL命令の一部として解釈される</text><rect x="30" y="325" width="740" height="175" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="55" y="365" font-size="24" fill="#087f68" text-anchor="start" font-weight="700">対策：SQLの構造と値を別々に渡す</text><text x="55" y="412" font-size="24" fill="#16324f" text-anchor="start" font-weight="400">SELECT … WHERE user_id = ?</text><text x="55" y="458" font-size="22" fill="#16324f" text-anchor="start" font-weight="400">?へ値をバインド → 入力はデータとして扱う</text><rect x="24" y="546" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="580" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">SQLで特別な意味を持つ入力を、命令として働かせない</text></g></svg>