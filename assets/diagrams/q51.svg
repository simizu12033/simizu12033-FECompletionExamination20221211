<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title51"><title id="title51">問51 プロジェクトライフサイクル</title><defs><marker id="a51" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問51 プロジェクトライフサイクル</text><path d="M75 405 L725 405" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a51)"/><path d="M75 405 L75 150" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a51)"/><text x="725" y="443" font-size="20" fill="#16324f" text-anchor="end" font-weight="400"></text><text x="67" y="132" font-size="20" fill="#16324f" text-anchor="start" font-weight="400"></text><text x="400" y="475" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">プロジェクトの進行 →</text><path d="M90 170 C240 180 440 360 700 385" fill="none" stroke="#2563a6" stroke-width="4"/><path d="M90 385 C330 380 520 350 700 165" fill="none" stroke="#b33b44" stroke-width="4"/><text x="120" y="130" font-size="22" fill="#2563a6" text-anchor="start" font-weight="400">リスク・不確実性</text><text x="500" y="130" font-size="22" fill="#b33b44" text-anchor="start" font-weight="400">変更コスト</text><text x="90" y="444" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">初期</text><text x="700" y="444" font-size="21" fill="#16324f" text-anchor="middle" font-weight="400">終盤</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">エ：進行とともにリスクは減少。一方、変更コストは増えやすい</text></g></svg>