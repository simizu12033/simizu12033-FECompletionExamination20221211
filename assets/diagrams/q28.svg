<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title28"><title id="v7title28">問28 外部キーと参照整合性</title><desc>存在する顧客だけを、注文から参照できる。参照先がないC99は拒否 → 外部キーによる参照整合性</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問28 外部キーと参照整合性</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">存在する顧客だけを、注文から参照できる</text><path d="M30 108H770" stroke="#cbdde9"/><g transform="translate(150 180) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-43 -27V31C-43 51 43 51 43 31V-27" fill="white"/><ellipse cx="0" cy="-27" rx="43" ry="15" fill="#e4f5ed"/><path d="M-43 -1C-43 18 43 18 43 -1M-43 17C-43 36 43 36 43 17" fill="none"/></g><text x="150" y="226.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">顧客表</text><text x="150" y="247.60000000000002" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400">親のキー</text><g transform="translate(650 180) scale(0.65)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="650" y="226.8" font-size="22" fill="#2872ae" text-anchor="middle" font-weight="700">注文表</text><text x="650" y="247.60000000000002" font-size="18" fill="#61768a" text-anchor="middle" font-weight="400">外部キー</text><rect x="40" y="330" width="220" height="64" rx="4" fill="#e4f5ed" stroke="#2872ae" stroke-width="2"/><text x="150" y="371" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">C01 青木</text><rect x="40" y="430" width="220" height="64" rx="4" fill="white" stroke="#2872ae" stroke-width="2"/><text x="150" y="471" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">C02 井上</text><rect x="540" y="330" width="220" height="64" rx="4" fill="#e4f5ed" stroke="#2872ae" stroke-width="2"/><text x="650" y="371" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">O101 → C01</text><rect x="540" y="430" width="220" height="64" rx="4" fill="white" stroke="#2872ae" stroke-width="2"/><text x="650" y="471" font-size="23" fill="#16324f" text-anchor="middle" font-weight="400">O102 → C99</text><path d="M530 362L270 362" stroke="#078268" stroke-width="3" fill="none"/><path d="M270.0 362.0L281.7 356.3L281.7 367.7Z" stroke="#078268" stroke-width="1" fill="#078268"/><rect x="346.5" y="328.0" width="107" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="400.0" y="350.0" font-size="19" fill="#078268" text-anchor="middle" font-weight="400">参照先あり</text><path d="M530 462L350 462" stroke="#b34b52" stroke-width="3" fill="none"/><path d="M350.0 462.0L361.7 456.3L361.7 467.7Z" stroke="#b34b52" stroke-width="1" fill="#b34b52"/><rect x="389.0" y="428.0" width="102" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="440.0" y="450.0" font-size="19" fill="#b34b52" text-anchor="middle" font-weight="400">C99がない</text><path d="M315 438L345 486M345 438L315 486" stroke="#b34b52" stroke-width="4" fill="none"/><text x="400" y="580" font-size="23" fill="#078268" text-anchor="middle" font-weight="400">検索高速化ではなく、不整合な登録を防ぐ制約</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">参照先がないC99は拒否 → 外部キーによる参照整合性</text></g></svg>