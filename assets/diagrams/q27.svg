<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" role="img" aria-labelledby="v7title27"><title id="v7title27">問27 NOT EXISTS</title><desc>商品ごとに「対応する在庫がない」を調べる。相関NOT EXISTSで、在庫表にない商品を取り出す</desc><rect width="800" height="720" rx="18" fill="#f8fbfe"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="30" y="39" font-size="18" fill="#61768a">問27 NOT EXISTS</text><text x="30" y="82" font-size="27" font-weight="700" fill="#16324f">商品ごとに「対応する在庫がない」を調べる</text><path d="M30 108H770" stroke="#cbdde9"/><g transform="translate(135 215) scale(0.7)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="135" y="290" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">商品A</text><path d="M110 420L160 470M160 420L110 470" stroke="#b34b52" stroke-width="4" fill="none"/><text x="135" y="550" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">在庫なし → 選ぶ</text><g transform="translate(400 215) scale(0.7)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="400" y="290" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">商品B</text><g transform="translate(400 450) scale(0.6)" stroke="#2872ae" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-43 -27V31C-43 51 43 51 43 31V-27" fill="white"/><ellipse cx="0" cy="-27" rx="43" ry="15" fill="#e4f5ed"/><path d="M-43 -1C-43 18 43 18 43 -1M-43 17C-43 36 43 36 43 17" fill="none"/></g><path d="M400 320L400 395" stroke="#2872ae" stroke-width="3" fill="none"/><path d="M400.0 395.0L394.3 383.3L405.7 383.3Z" stroke="#2872ae" stroke-width="1" fill="#2872ae"/><rect x="337.0" y="335.5" width="126" height="29" rx="4" fill="#f8fbfe" stroke="none" stroke-width="2"/><text x="400.0" y="357.5" font-size="19" fill="#2872ae" text-anchor="middle" font-weight="400">同じ商品番号</text><text x="400" y="550" font-size="21" fill="#61768a" text-anchor="middle" font-weight="400">在庫あり → 除外</text><g transform="translate(665 215) scale(0.7)" stroke="#078268" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 -44H15L34 -25V45H-32Z" fill="white"/><path d="M15 -44V-25H34M-19 -8H19M-19 7H19M-19 22H8" fill="none"/></g><text x="665" y="290" font-size="24" fill="#16324f" text-anchor="middle" font-weight="700">商品C</text><path d="M640 420L690 470M690 420L640 470" stroke="#b34b52" stroke-width="4" fill="none"/><text x="665" y="550" font-size="21" fill="#078268" text-anchor="middle" font-weight="700">在庫なし → 選ぶ</text><text x="400" y="600" font-size="21" fill="#61768a" text-anchor="middle" font-weight="400">外側の商品番号と、副問合せの在庫を結び付ける</text><path d="M30 625H770" stroke="#cbdde9"/><text x="400" y="670" font-size="21" font-weight="700" fill="#078268" text-anchor="middle">相関NOT EXISTSで、在庫表にない商品を取り出す</text></g></svg>