<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title50"><title id="title50">問50 バーンダウンチャート</title><defs><marker id="a50" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563a6"/></marker></defs><rect width="800" height="560" fill="#fbfdff"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="25" y="42" font-size="25" fill="#16324f" font-weight="700">問50 バーンダウンチャート</text><path d="M90 410 L700 410" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a50)"/><path d="M90 410 L90 140" fill="none" stroke="#16324f" stroke-width="2" marker-end="url(#a50)"/><text x="700" y="448" font-size="20" fill="#16324f" text-anchor="end" font-weight="400"></text><text x="82" y="122" font-size="20" fill="#16324f" text-anchor="start" font-weight="400">残作業量</text><text x="560" y="465" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">時間 →</text><path d="M90 145 L680 410" fill="none" stroke="#60758a" stroke-width="3" stroke-dasharray="7 5"/><path d="M90 145 L190 185 L290 215 L390 292 L490 310 L590 370 L680 402" fill="none" stroke="#087f68" stroke-width="4"/><text x="490" y="170" font-size="21" fill="#60758a" text-anchor="start" font-weight="400">点線：理想</text><text x="490" y="210" font-size="21" fill="#087f68" text-anchor="start" font-weight="400">実線：実績</text><text x="90" y="445" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">開始</text><text x="680" y="445" font-size="20" fill="#16324f" text-anchor="middle" font-weight="400">終了</text><text x="75" y="415" font-size="19" fill="#16324f" text-anchor="end" font-weight="400">0</text><rect x="24" y="486" width="752" height="54" rx="8" fill="#dcf3e9" stroke="#087f68" stroke-width="2"/><text x="400" y="520" font-size="21" fill="#087f68" text-anchor="middle" font-weight="700">縦軸は「残り」。時間とともに減るのがバーンダウン</text></g></svg>